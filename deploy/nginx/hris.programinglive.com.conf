server {
    listen 80;
    server_name hris.programinglive.com;

    root /var/www/hris.programinglive.com/public;
    index index.php;

    charset utf-8;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # REQUIRED. TLS is terminated by the GCP load balancer, which forwards to
        # this server over plain HTTP on port 80. Without passing the original
        # scheme through, Laravel's asset() and @vite emit http:// URLs and the
        # browser blocks every stylesheet and script as mixed content — the page
        # renders blank with no visible error.
        fastcgi_param HTTPS $http_x_forwarded_proto;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
