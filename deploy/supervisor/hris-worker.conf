[program:hris-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/hris.programinglive.com/artisan queue:work database --sleep=3 --tries=3 --max-time=3600
directory=/var/www/hris.programinglive.com
user=www-data
autostart=true
autorestart=true
numprocs=2
startsecs=3
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/var/log/hris-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
